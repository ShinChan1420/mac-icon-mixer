name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday, so new security checks run even when the code hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Security scan
    # CodeQL can only analyse Swift on macOS.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        run: swift build
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
